# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Publish the live site and a preview of the website branch.
  push:
    branches: ["main", "website"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live site
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: website
          path: website
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Assemble site and preview
        run: |
          mkdir -p site/preview
          rsync -a --exclude='.git' --exclude='.github' main/ site/
          rsync -a --exclude='.git' --exclude='.github' website/ site/preview/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
