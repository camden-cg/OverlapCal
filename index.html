<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hangout Finder</title>
<style>
:root{--bg:#fff;--fg:#202124;--muted:#5f6368;--line:#dadce0;--accent:#1a73e8;--onaccent:#fff;--panel:#f1f3f4;--hr:48px;
  --evs:75%;--evl:86%;--evfg:22%;--evbar:45%;--best:rgba(52,168,83,.16)}
@media(prefers-color-scheme:dark){:root{--bg:#202124;--fg:#e8eaed;--muted:#9aa0a6;--line:#3c4043;--accent:#8ab4f8;--onaccent:#202124;--panel:#303134;
  --evs:35%;--evl:28%;--evfg:90%;--evbar:60%;--best:rgba(52,168,83,.25)}}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;font:14px/1.4 "Google Sans",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--fg)}
button,select,input{font:inherit;color:inherit}
input,select{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--bg)}
#view{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.muted,small{color:var(--muted)}
.btn{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 16px;cursor:pointer}
.btn:hover,.ib:hover{background:var(--panel)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:none;cursor:pointer;font-size:22px;line-height:1}
header{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-size:20px;margin-right:8px}
main{flex:1;display:flex;min-height:0}
#scroll{flex:1;overflow-y:auto;min-width:0}
.row,#body{display:grid;grid-template-columns:56px repeat(var(--n),1fr)}
#head{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);user-select:none;-webkit-user-select:none}
.dh{text-align:center;padding:6px 0;border-left:1px solid var(--line)}
.dh small{display:block;font-size:11px;letter-spacing:.6px}
.dh b{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;font-size:22px;font-weight:400}
.dh.today b{background:var(--accent);color:var(--onaccent)}
#body{user-select:none;-webkit-user-select:none;touch-action:pan-y;cursor:crosshair}
.gut{position:relative}
.gut span{position:absolute;right:8px;transform:translateY(-50%);font-size:10px;color:var(--muted)}
.col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hr)}
.ev{position:absolute;border-radius:8px;padding:3px 6px;overflow:hidden;font-size:12px;line-height:1.25;pointer-events:none;z-index:1;
  background:color-mix(in srgb,var(--c) 24%,var(--bg));color:var(--fg);border-left:4px solid var(--c);box-shadow:0 0 0 1px var(--bg)}
.ev b{display:block}
.ev.me{box-shadow:0 0 0 1px var(--bg),0 1px 4px rgba(0,0,0,.35);pointer-events:auto;cursor:pointer}
.ev.ghost{opacity:.8;outline:2px dashed var(--c);z-index:2}
.x{position:absolute;top:2px;right:2px;width:18px;height:18px;border:0;border-radius:50%;background:rgba(0,0,0,.15);cursor:pointer;pointer-events:auto;display:none;line-height:1;font-size:13px;padding:0}
.ev.me:hover .x{display:block}
@media(hover:none){.ev.me .x{display:block}}
.best{position:absolute;left:0;right:0;border-radius:8px;background:var(--best);outline:2px dashed #34a853;outline-offset:-2px;pointer-events:none}
.now{position:absolute;left:0;right:0;height:2px;background:#ea4335;pointer-events:none;z-index:3}
.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#ea4335}
aside{width:290px;border-left:1px solid var(--line);padding:16px;overflow:auto}
aside h3{margin:16px 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
aside h3:first-child{margin-top:0}
.item{padding:8px 12px;margin-bottom:6px;border-radius:12px;background:var(--panel);cursor:pointer}
.item:hover{outline:2px solid var(--accent)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.person-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:color-mix(in srgb,var(--person-color) 70%,var(--fg))}
.person-name small{color:inherit;opacity:.8}
.person-name-picker{position:relative;display:inline-flex;align-items:center;cursor:pointer}
.name-color-picker{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;opacity:0;cursor:pointer;appearance:none;-webkit-appearance:none}
.slot-form{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.slot-form input[type=date],.slot-form button{grid-column:1/-1}
.slot-form input{width:100%;min-width:0;padding:7px 8px}
.filter-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.filter-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:4px 7px;background:var(--panel);font-size:11px}
.filter-chip button{border:0;background:none;cursor:pointer;padding:0 1px;font-size:15px;line-height:1}
.filter-person{padding:7px 8px;margin:5px 0;border-radius:8px;background:var(--panel)}
.filter-person-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.person-ident{display:flex;align-items:center;gap:5px;min-width:0;flex:1}
.filter-count{font-size:11px;color:var(--muted)}
.filter-statuses{display:flex;align-items:center;gap:3px;flex:0 1 auto;max-width:96px;overflow-x:auto}
.filter-status{display:grid;place-items:center;flex:0 0 16px;width:16px;height:16px;border-radius:50%;background:var(--person-color);color:#fff;font-size:10px;font-weight:700;line-height:1}
.filter-status.no{border:1px solid var(--person-color);background:transparent;color:var(--person-color)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20}
.card{background:var(--bg);border-radius:16px;padding:24px;width:min(380px,90vw);box-shadow:0 8px 30px rgba(0,0,0,.3)}
.card h2{margin:0 0 4px}
.edit-field{display:block;margin:12px 0}
.edit-field input{display:block;width:100%;margin-top:4px}
.modal-actions,.modal-buttons{display:flex;align-items:center;gap:8px}
.modal-actions{justify-content:space-between;margin-top:18px}
.modal-buttons{justify-content:flex-end}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
.land{max-width:420px;margin:10vh auto;padding:0 20px;display:flex;flex-direction:column;gap:12px}
.land a{color:var(--accent);text-decoration:none;padding:6px 0}
.calendar-view{padding:18px;max-width:1100px;margin:0 auto}
.month-grid{display:grid;grid-template-columns:repeat(7,minmax(34px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.weekday,.month-day{border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
.weekday{padding:8px 2px;color:var(--muted);font-size:12px;font-weight:600}
.month-day{min-height:84px;padding:8px 4px;cursor:pointer}
.month-day:hover,.year-month:hover{background:var(--panel)}
.month-day.other{color:var(--muted);opacity:.55}
.month-day.today .day-number{background:var(--accent);color:var(--onaccent)}
.day-number{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%}
.availability-dots{display:flex;justify-content:center;flex-wrap:wrap;gap:3px;margin:7px auto 0;max-width:56px}
.availability-dots i{width:7px;height:7px;border-radius:50%}
.year-grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px}
.year-month{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.year-month h3{margin:0 0 8px;font-size:14px}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:10px}
.mini-grid span{min-height:18px;display:grid;place-items:center;border-radius:4px}
.mini-grid .mini-weekday{color:var(--muted);font-weight:600}
.mini-grid .mini-day.other{opacity:.3}
.mini-grid .mini-day.has{background:color-mix(in srgb,var(--day-color) 28%,var(--bg))}
.mini-grid .mini-day.overlap{outline:1px solid #34a853}
@media(max-width:700px){.year-grid{grid-template-columns:repeat(2,minmax(120px,1fr))}.month-day{min-height:60px;padding:4px 1px}.availability-dots{gap:2px}}
@media(max-width:800px){main{flex-direction:column}aside{width:auto;border-left:0;border-top:1px solid var(--line);max-height:38%}}
</style>
</head>
<body>
<script>


  
//THIS IS WHAT YOU ARE REPLACING WITH THE FIREBASE LINK YOU JUST COPIED

const DB = "https://overlapcal-default-rtdb.firebaseio.com/";


  
const HR = 48, GUT = 56, HOUR = 36e5, $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS = ['#4285f4','#ea4335','#34a853','#fbbc04','#a142f4','#ff6d01','#12a4a6','#e52592','#5f6368','#7cb342','#8e24aa','#00897b'];
const validColor = c => /^#[0-9a-f]{6}$/i.test(c || '');
const colorHex = h => {
  const f = n => { const k = (n + h / 30) % 12, a = .325; return .5 - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return '#' + [f(0), f(8), f(4)].map(c => Math.round(c * 255).toString(16).padStart(2, '0')).join('');
};
const nextColor = used => {
  const palette = COLORS.find(c => !used.has(c));
  if (palette) return palette;
  for (let h = 0; h < 360; h++) { const color = colorHex(h); if (!used.has(color)) return color; }
  for (let n = 1; n <= 0xffffff; n++) { const color = '#' + n.toString(16).padStart(6, '0'); if (!used.has(color)) return color; }
  throw Error('No unused participant colors remain.');
};
const colorOf = p => validColor(p.color) ? p.color : '#4285f4';
const key = n => n.trim().toLowerCase().replace(/[.$#\[\]\/]/g, '_');
const fmtT = t => new Date(t).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
const fmtD = t => new Date(t).toLocaleDateString([], {weekday: 'short', month: 'short', day: 'numeric'});
const addDays = (t, n) => { const d = new Date(t); d.setDate(d.getDate() + n); return d.getTime(); };
const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const inputDate = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const inputDateTime = t => { const d = new Date(t); return `${inputDate(t)}T${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const slotTime = (date, time) => { const [y, m, d] = date.split('-').map(Number), [h, min] = time.split(':').map(Number); return new Date(y, m - 1, d, h, min).getTime(); };
const merge = bs => { const o = []; for (const b of [...bs].sort((a, c) => a.s - c.s)) { const l = o[o.length - 1]; l && b.s <= l.e ? l.e = Math.max(l.e, b.e) : o.push({s: b.s, e: b.e}); } return o; };
const toast = m => { const t = $('#toast'); t.textContent = m; t.className = 'on'; clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 2200); };

// ---- storage: Firebase Realtime Database over plain fetch, or localStorage in demo mode ----
const api = {
  async get(id) {
    if (!DB) return JSON.parse(localStorage.getItem('hf:' + id) || '{}');
    const r = await fetch(`${DB}/groups/${id}.json`); if (!r.ok) throw Error(r.status);
    return (await r.json()) || {};
  },
  async put(id, path, val) {
    if (!DB) {
      const g = JSON.parse(localStorage.getItem('hf:' + id) || '{}'), [a, b] = path.split('/');
      if (b) { g[a] = g[a] || {}; val == null ? delete g[a][b] : g[a][b] = val; } else val == null ? delete g[a] : g[a] = val;
      return localStorage.setItem('hf:' + id, JSON.stringify(g));
    }
    const p = path.split('/').map(encodeURIComponent).join('/');
    const r = await fetch(`${DB}/groups/${id}/${p}.json`, {method: val == null ? 'DELETE' : 'PUT', body: JSON.stringify(val)});
    if (!r.ok) throw Error(r.status);
  }
};

const gid = (location.hash.match(/^#\/g\/([\w-]{10,30})$/) || [])[1];
addEventListener('hashchange', () => location.reload());

// ---- landing page: create a new group ----
function landing() {
  const groups = JSON.parse(localStorage.getItem('hf-groups') || '[]');
  document.body.innerHTML = `<div class="land"><h1 style="margin:0">Hangout Finder</h1>
    <p class="muted">Make a group, send the link, and everyone adds when they're free. The best overlap shows up automatically.</p>
    <input id="t" placeholder="Group name (e.g. Friday dinner)" maxlength="60">
    <button class="btn primary" id="go">Create group link</button>
    ${groups.length ? '<h3>Your groups</h3>' + groups.map(g => `<a href="#/g/${g.id}">${esc(g.title || 'Untitled group')}</a>`).join('') : ''}
    ${DB ? '' : '<p class="muted"><small>Demo mode: data stays in this browser. Set DB in index.html to sync between people.</small></p>'}</div><div id="toast"></div>`;
  $('#go').onclick = async () => {
    const id = [...crypto.getRandomValues(new Uint8Array(16))].map(b => (b % 36).toString(36)).join(''), title = $('#t').value.trim();
    try { await api.put(id, 'title', title || null); } catch { return toast('Could not create group. Check your connection.'); }
    remember(id, title); location.hash = '#/g/' + id;
  };
}
function remember(id, title) {
  const l = JSON.parse(localStorage.getItem('hf-groups') || '[]').filter(g => g.id !== id);
  localStorage.setItem('hf-groups', JSON.stringify([{id, title}, ...l].slice(0, 30)));
}

// ---- group page ----
const S = {people: {}, title: '', name: '', view: innerWidth < 700 ? 3 : 7, anchor: startOfDay(Date.now()), drag: null, editCandidate: null, pending: 0, hr: HR, pinching: false, pinchStart: null, touchPoints: new Map(), filters: []};
const mine = () => (S.people[key(S.name)] || {}).blocks || [];
const days = () => { const count = +S.view, s = count >= 7 ? addDays(S.anchor, -new Date(S.anchor).getDay()) : S.anchor; return Array.from({length: count}, (_, i) => addDays(s, i)); };
const monthStart = t => { const d = new Date(t); d.setDate(1); d.setHours(0, 0, 0, 0); return d.getTime(); };
const norm = g => {
  const people = {}, used = new Set();
  for (const [k, v] of Object.entries(g.people || {})) {
    let color = validColor(v.color) && !used.has(v.color.toLowerCase()) ? v.color.toLowerCase() : null;
    if (!color) color = nextColor(used);
    used.add(color);
    people[k] = {name: v.name || k, color, blocks: merge(Object.values(v.blocks || {}).filter(b => b && b.e > b.s))};
  }
  return people;
};

function bestAll() {
  const P = Object.values(S.people).filter(p => p.blocks.length);
  const total = Object.keys(S.people).length;
  const pts = [...new Set(P.flatMap(p => p.blocks.flatMap(b => [b.s, b.e])))].sort((a, b) => a - b), segs = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], z = pts[i + 1], who = P.filter(p => p.blocks.some(x => x.s <= a && x.e >= z)).map(p => p.name).sort();
    if (who.length) segs.push({s: a, e: z, who});
  }
  const max = Math.max(0, ...segs.map(s => s.who.length)), list = [];
  const join = matches => {
    const out = [];
    for (const s of matches) {
      const last = out[out.length - 1];
      last && last.e === s.s && last.who.join() === s.who.join() ? last.e = s.e : out.push({...s});
    }
    return out;
  };
  if (max >= 2) {
    for (const s of join(segs.filter(s => s.who.length === max))) list.push(s);
  }
  return {max, list, everyone: total ? join(segs.filter(s => s.who.length === total)) : []};
}

const availableOn = (person, start, end) => person.blocks.some(b => b.s < end && b.e > start);
function calendarDots(start, end) {
  const people = Object.values(S.people).filter(p => availableOn(p, start, end));
  return `<span class="availability-dots">${people.map(p => `<i title="${esc(p.name)}" style="background:${colorOf(p)}"></i>`).join('')}</span>`;
}
function renderMonth() {
  const first = monthStart(S.anchor), firstDate = new Date(first), offset = firstDate.getDay();
  const count = new Date(firstDate.getFullYear(), firstDate.getMonth() + 1, 0).getDate();
  const daysHtml = Array.from({length: Math.ceil((offset + count) / 7) * 7}, (_, i) => {
    const day = addDays(first - offset * 864e5, i), date = new Date(day), inMonth = date.getMonth() === firstDate.getMonth();
    return `<div class="month-day${inMonth ? '' : ' other'}${day === startOfDay(Date.now()) ? ' today' : ''}" data-day="${day}"><span class="day-number">${date.getDate()}</span>${calendarDots(day, addDays(day, 1))}</div>`;
  }).join('');
  $('#scroll').innerHTML = `<section class="calendar-view"><div class="month-grid">${['S','M','T','W','T','F','S'].map(d => `<div class="weekday">${d}</div>`).join('')}${daysHtml}</div></section>`;
  document.querySelectorAll('.month-day').forEach(el => el.onclick = () => { S.anchor = +el.dataset.day; S.view = 1; render(); });
}
function renderYear() {
  const year = new Date(S.anchor).getFullYear(), week = ['S','M','T','W','T','F','S'];
  const months = Array.from({length:12}, (_, m) => {
    const first = new Date(year, m, 1).getTime(), start = addDays(first, -new Date(first).getDay()), count = new Date(year, m + 1, 0).getDate();
    const cells = Array.from({length:Math.ceil((new Date(first).getDay() + count) / 7) * 7}, (_, i) => {
      const day = addDays(start, i), date = new Date(day), inside = date.getMonth() === m, people = Object.values(S.people).filter(p => availableOn(p, day, addDays(day, 1)));
      return `<span class="mini-day${inside ? '' : ' other'}${people.length ? ' has' : ''}${people.length > 1 ? ' overlap' : ''}"${people.length ? ` style="--day-color:${colorOf(people[0])}" title="${people.map(p => esc(p.name)).join(', ')}"` : ''}>${date.getDate()}</span>`;
    }).join('');
    return `<div class="year-month" data-month="${m}"><h3>${new Date(year,m,1).toLocaleDateString([], {month:'long'})}</h3><div class="mini-grid">${week.map(d => `<span class="mini-weekday">${d}</span>`).join('')}${cells}</div></div>`;
  }).join('');
  $('#scroll').innerHTML = `<section class="calendar-view"><div class="year-grid">${months}</div></section>`;
  document.querySelectorAll('.year-month').forEach(el => el.onclick = () => { const d = new Date(year, +el.dataset.month, 1); S.anchor = d.getTime(); S.view = 'month'; render(); });
}

async function save(blocks, requestedColor) {
  const k = key(S.name), used = new Set(Object.entries(S.people).filter(([id]) => id !== k).map(([, p]) => colorOf(p).toLowerCase()));
  const current = (S.people[k] || {}).color;
  const color = validColor(requestedColor) && !used.has(requestedColor.toLowerCase()) ? requestedColor.toLowerCase()
    : validColor(current) && !used.has(current.toLowerCase()) ? current.toLowerCase() : nextColor(used);
  S.people[k] = {name: S.name, color, blocks}; S.pending++;
  try { await api.put(gid, 'people/' + k, {name: S.name, color, blocks}); } catch { toast("Couldn't save. Check your connection."); }
  S.pending--; render();
}

function render() {
  const names = Object.keys(S.people).sort(), best = bestAll();
  $('#ttl').textContent = S.title; document.title = (S.title ? S.title + ' · ' : '') + 'Hangout Finder';
  $('#who').textContent = S.name || 'Set name'; $('#view').value = S.view;
  if (S.view === 'year') {
    $('#range').textContent = new Date(S.anchor).getFullYear();
    renderYear(); side(best, names); return;
  }
  if (S.view === 'month') {
    $('#range').textContent = new Date(S.anchor).toLocaleDateString([], {month:'long',year:'numeric'});
    renderMonth(); side(best, names); return;
  }
  if (!$('#head')) $('#scroll').innerHTML = '<div class="row" id="head"></div><div id="body"></div>';
  const D = days(), today = startOfDay(Date.now()), hr = S.hr;
  document.documentElement.style.setProperty('--hr', hr + 'px');
  $('#scroll').style.setProperty('--n', S.view);
  const a = new Date(D[0]), z = new Date(D[D.length - 1]), mo = d => d.toLocaleDateString([], {month: 'short'});
  $('#range').textContent = a.getMonth() === z.getMonth() ? `${mo(a)} ${a.getDate()}${D.length < 2 ? '' : ' – ' + z.getDate()}, ${z.getFullYear()}` : `${mo(a)} ${a.getDate()} – ${mo(z)} ${z.getDate()}, ${z.getFullYear()}`;
  $('#head').innerHTML = '<div></div>' + D.map(ds => `<div class="dh${ds === today ? ' today' : ''}"><small>${new Date(ds).toLocaleDateString([], {weekday: 'short'}).toUpperCase()}</small><b>${new Date(ds).getDate()}</b></div>`).join('');
  const hours = Array.from({length: 23}, (_, i) => `<span style="top:${(i + 1) * hr}px">${new Date(2000, 0, 1, i + 1).toLocaleTimeString([], {hour: 'numeric'})}</span>`).join('');
  $('#body').style.height = `${24 * hr}px`;
  $('#body').innerHTML = `<div class="gut">${hours}</div>` + D.map(ds => {
    const de = addDays(ds, 1); let h = '';
    const pos = (s, e) => { const p = Math.max(s, ds), q = Math.min(e, de); return `top:${(p - ds) / HOUR * hr}px;height:${Math.max((q - p) / HOUR * hr, 16)}px`; };
    best.list.forEach(x => { if (x.s < de && x.e > ds) h += `<div class="best" style="${pos(x.s, x.e)}"></div>`; });
    const events = names.flatMap(k => S.people[k].blocks
      .filter(b => b.s < de && b.e > ds)
      .map(b => ({k, p: S.people[k], b, s: Math.max(b.s, ds), e: Math.min(b.e, de)})))
      .sort((a, b) => a.s - b.s || a.e - b.e || a.k.localeCompare(b.k));
    const laneEnds = [], lanes = [];
    events.forEach(event => {
      let lane = laneEnds.findIndex(end => end <= event.s);
      if (lane < 0) { lane = laneEnds.length; laneEnds.push(event.e); lanes.push([]); }
      else laneEnds[lane] = event.e;
      event.lane = lane;
      lanes[lane].push(event);
    });
    const columns = Math.max(laneEnds.length, 1);
    events.forEach(event => {
      let span = 1;
      for (let lane = event.lane + 1; lane < columns; lane++) {
        if (lanes[lane].some(other => other.s < event.e && other.e > event.s)) break;
        span++;
      }
      const {k, p, b, s, e} = event, me = k === key(S.name);
      h += `<div class="ev${me ? ' me' : ''}"${me ? ` role="group" tabindex="0" data-s="${b.s}" data-e="${b.e}" aria-label="Availability ${fmtD(b.s)} ${fmtT(b.s)} to ${fmtD(b.e)} ${fmtT(b.e)}. Press Enter to edit."` : ''} style="${pos(b.s, b.e)};left:calc(${event.lane} * 100% / ${columns} + 1px);width:calc(${span} * 100% / ${columns} - 3px);--c:${colorOf(p)}"><b>${esc(p.name)}</b>${e - s >= HOUR * .75 ? fmtT(s) + ' – ' + fmtT(e) : ''}${me ? `<button class="x" data-s="${b.s}" title="Remove">×</button>` : ''}</div>`;
    });
    if (ds === today) h += `<div class="now" style="top:${(Date.now() - ds) / HOUR * hr}px"></div>`;
    return `<div class="col">${h}</div>`;
  }).join('');
  side(best, names); wire(); ghost();
}

function side(best, names) {
  const total = names.length, future = best.list.filter(x => x.e > Date.now()).slice(0, 8);
  const timeLabel = x => `${fmtD(x.s)} · ${fmtT(x.s)} – ${startOfDay(x.s) === startOfDay(x.e - 1) ? '' : fmtD(x.e - 1) + ' '}${fmtT(x.e)}`;
  const everyone = best.everyone.map(x => `<div class="item" data-start="${x.s}"><b>${timeLabel(x)}</b></div>`).join('');
  const chips = S.filters.map((f, i) => `<span class="filter-chip"><span>${timeLabel(f)}</span><button type="button" data-remove-filter="${i}" aria-label="Remove time filter">×</button></span>`).join('');
  const ranked = names.map(k => {
    const p = S.people[k], matches = S.filters.map(f => p.blocks.some(b => b.s <= f.s && b.e >= f.e));
    return {k, p, matches, count: matches.filter(Boolean).length};
  }).sort((a, b) => b.count - a.count || a.p.name.localeCompare(b.p.name));
  const people = ranked.map(({k, p, matches, count}) => {
    const me = k === key(S.name), color = colorOf(p);
    const name = me
      ? `<label class="person-name person-name-picker" style="--person-color:${color}"><span>${esc(p.name)} <small>(you)</small></span><input class="name-color-picker" type="color" value="${color}" aria-label="Change your color" title="Change your color"></label>`
      : `<span class="person-name" style="--person-color:${color}">${esc(p.name)}</span>`;
    const statuses = matches.map((available, i) => `<span class="filter-status ${available ? 'yes' : 'no'}" style="--person-color:${colorOf(p)}" aria-label="${available ? 'Available' : 'Unavailable'} for filter ${i + 1}" title="${available ? 'Available' : 'Unavailable'} for filter ${i + 1}">${available ? '✓' : '×'}</span>`).join('');
    return `<div class="${S.filters.length ? 'filter-person' : ''}"><div class="filter-person-head"><span class="person-ident">${S.filters.length ? `<span class="filter-statuses">${statuses}</span>` : ''}${name}</span>${S.filters.length ? `<span class="filter-count">${count}/${S.filters.length}</span>` : ''}</div></div>`;
  }).join('');
  const bestSection = best.max < 2
    ? '<h3>Best overlap</h3><p class="muted">No overlap yet. Drag on the calendar to add your free times.</p>'
    : best.max === total ? ''
      : '<h3>Best overlap</h3>' + `<p class="muted">${best.max} of ${total} people free</p>` + future.map(x =>
        `<div class="item" data-start="${x.s}"><b>${timeLabel(x)}</b><br><small>${x.who.map(esc).join(', ')}</small></div>`).join('');
  $('#side').innerHTML = '<h3>Everyone free</h3>' + (everyone || '<p class="muted">No times found when everyone is free.</p>')
    + bestSection
    + '<h3>Check availability</h3><form id="slotForm" class="slot-form"><input id="slotDate" type="date" aria-label="Day" value="' + inputDate(Date.now()) + '" required><input id="slotStart" type="time" aria-label="Start time" value="18:00" required><input id="slotEnd" type="time" aria-label="End time" value="19:00" required><button class="btn" type="submit">Add time filter</button></form>'
    + `<div class="filter-chips">${chips}</div><h3>People</h3>` + (people || '<p class="muted">Nobody yet.</p>')
    + '<p style="margin-top:16px"><button class="btn" id="clear">Clear my times</button></p><p class="muted"><small>Anyone with this link can see and edit this group.</small></p>';
  $('#clear').onclick = () => mine().length && confirm('Remove all your free times?') && save([]);
  $('#side').onsubmit = e => {
    if (e.target.id !== 'slotForm') return;
    e.preventDefault();
    const s = slotTime($('#slotDate').value, $('#slotStart').value), end = slotTime($('#slotDate').value, $('#slotEnd').value);
    if (end <= s) { toast('End time must be after start time.'); return; }
    S.filters.push({s, e: end}); render();
  };
  $('#side').querySelectorAll('[data-remove-filter]').forEach(el => el.onclick = () => {
    S.filters.splice(+el.dataset.removeFilter, 1); render();
  });
  $('#side').onchange = e => {
    if (!e.target.matches('.name-color-picker')) return;
    const chosen = e.target.value.toLowerCase(), duplicate = Object.entries(S.people).some(([k, p]) => k !== key(S.name) && colorOf(p).toLowerCase() === chosen);
    if (duplicate) { toast('That color is already used in this group.'); render(); return; }
    save(mine(), chosen);
  };
  document.querySelectorAll('.item[data-start]').forEach(el => el.onclick = () => {
    const time = +el.dataset.start; S.anchor = startOfDay(time); S.view = 1; render();
    $('#scroll').scrollTop = Math.max(0, (time - startOfDay(time)) / HOUR - 1) * S.hr;
  });
}

function editBlock(start, end) {
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `<form class="card" id="editAvailability">
    <h2>Edit availability</h2>
    <label class="edit-field">Starts<input id="editStart" type="datetime-local" value="${inputDateTime(start)}" required></label>
    <label class="edit-field">Ends<input id="editEnd" type="datetime-local" value="${inputDateTime(end)}" required></label>
    <div class="modal-actions"><button class="btn" id="removeAvailability" type="button">Remove</button><span class="modal-buttons"><button class="btn" id="cancelEdit" type="button">Cancel</button><button class="btn primary" type="submit">Save</button></span></div>
  </form>`;
  document.body.append(modal);
  const form = modal.querySelector('#editAvailability');
  form.onsubmit = event => {
    event.preventDefault();
    const s = new Date($('#editStart').value).getTime(), end = new Date($('#editEnd').value).getTime();
    if (!Number.isFinite(s) || !Number.isFinite(end) || end <= s) { toast('End time must be after start time.'); return; }
    modal.remove();
    save(merge([...mine().filter(b => b.s !== start), {s, e: end}]));
  };
  modal.querySelector('#removeAvailability').onclick = () => {
    if (!confirm('Remove this availability?')) return;
    modal.remove(); save(mine().filter(b => b.s !== start));
  };
  modal.querySelector('#cancelEdit').onclick = () => modal.remove();
  modal.onclick = e => { if (e.target === modal) modal.remove(); };
  modal.onkeydown = e => { if (e.key === 'Escape') modal.remove(); };
  modal.querySelector('#editStart').focus();
}

function zoomAt(value, clientY) {
  if (typeof S.view !== 'number') return;
  const body = $('#body'), scroll = $('#scroll');
  if (!body) return;
  const old = S.hr, next = Math.max(24, Math.min(96, value));
  if (next === old) return;
  const y = Math.max(0, Math.min(body.offsetHeight, clientY - body.getBoundingClientRect().top));
  S.hr = next;
  render();
  scroll.scrollTop += y * (next / old - 1);
}

// ---- drag to select (mouse) / tap start then tap end (touch) ----
const rng = d => {
  const D = days();
  const a = D[d.a.d] + d.a.m * 60000;
  const b = D[d.b.d] + d.b.m * 60000;
  return {s: Math.min(a, b), e: Math.max(a, b) + 30 * 60000};
};
function cellAt(e) {
  const r = $('#body').getBoundingClientRect(), w = (r.width - GUT) / S.view;
  return {d: Math.min(Math.max(Math.floor((e.clientX - r.left - GUT) / w), 0), S.view - 1),
          m: Math.min(Math.max(Math.floor((e.clientY - r.top) / S.hr * 2) * 30, 0), 1410)};
}
function ghost() {
  document.querySelectorAll('.ghost').forEach(g => g.remove());
  if (!S.drag) return;
  const r = rng(S.drag), D = days(), cols = document.querySelectorAll('.col');
  D.forEach((ds, i) => {
    const de = addDays(ds, 1), start = Math.max(r.s, ds), end = Math.min(r.e, de);
    if (end <= start) return;
    const el = document.createElement('div'); el.className = 'ev ghost';
    el.style.cssText = `top:${(start - ds) / HOUR * S.hr}px;height:${(end - start) / HOUR * S.hr}px;left:1px;right:2px;--c:${colorOf(S.people[key(S.name)] || {})}`;
    el.innerHTML = `<b>${esc(S.name)}</b>${fmtT(start)} – ${fmtT(end)}`; cols[i].append(el);
  });
}
function commit(d) {
  const r = rng(d); S.drag = null;
  ghost();
  save(merge([...mine(), {s: r.s, e: r.e}]));
}
function wire() {
  const body = $('#body'), inGutter = e => e.clientX - body.getBoundingClientRect().left < GUT;
  const timeAt = e => {
    const r = body.getBoundingClientRect(), w = (r.width - GUT) / S.view, d = Math.min(Math.max(Math.floor((e.clientX - r.left - GUT) / w), 0), S.view - 1);
    return days()[d] + Math.max(0, Math.min(1440, (e.clientY - r.top) / S.hr * 60)) * 60000;
  };
  body.onpointerdown = e => {
    if (e.target.closest('.x') || typeof S.view !== 'number' || inGutter(e)) return;
    if (e.pointerType === 'touch') {
      S.touchPoints.set(e.pointerId, {x: e.clientX, y: e.clientY});
      if (S.touchPoints.size === 2 && typeof S.view === 'number') {
        const points = [...S.touchPoints.values()];
        S.touchPoints.forEach((point, id) => body.setPointerCapture(id));
        S.editCandidate = null; S.pinching = true; S.drag = null; ghost();
        S.pinchStart = {distance: Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y), hr: S.hr, y: (points[0].y + points[1].y) / 2};
      } else {
        const time = timeAt(e), block = e.target.closest('.ev.me') || mine().find(b => b.s <= time && time < b.e);
        if (block) {
          S.editCandidate = +(block.dataset ? block.dataset.s : block.s);
          e.preventDefault(); body.setPointerCapture(e.pointerId);
        } else S.editCandidate = null;
      }
      return;
    }
    const time = timeAt(e), block = e.target.closest('.ev.me') || mine().find(b => b.s <= time && time < b.e);
    if (block) { S.editCandidate = +(block.dataset ? block.dataset.s : block.s); e.preventDefault(); body.setPointerCapture(e.pointerId); return; }
    S.editCandidate = null;
    S.drag = {a: cellAt(e), b: cellAt(e), moved: false}; body.setPointerCapture(e.pointerId); ghost();
  };
  body.onpointermove = e => {
    if (e.pointerType === 'touch') {
      if (!S.touchPoints.has(e.pointerId)) return;
      S.touchPoints.set(e.pointerId, {x: e.clientX, y: e.clientY});
      if (S.pinching && S.touchPoints.size === 2 && S.pinchStart) {
        const points = [...S.touchPoints.values()];
        const distance = Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
        zoomAt(S.pinchStart.hr * distance / S.pinchStart.distance, S.pinchStart.y);
      }
      return;
    }
    if (!S.drag || S.drag.tap) return;
    const b = cellAt(e); S.drag.moved = S.drag.moved || b.d !== S.drag.a.d || b.m !== S.drag.a.m; S.drag.b = b; ghost();
  };
  body.onpointerup = e => {
    if (e.pointerType === 'touch') {
      const wasPinching = S.pinching;
      S.touchPoints.delete(e.pointerId);
      if (wasPinching) {
        if (!S.touchPoints.size) { S.pinching = false; S.pinchStart = null; S.drag = null; ghost(); }
        return;
      }
    }
    if (S.editCandidate !== null) {
      const start = S.editCandidate; S.editCandidate = null;
      const current = mine().find(b => b.s === start);
      if (current) editBlock(current.s, current.e);
      e.preventDefault(); return;
    }
    if (typeof S.view !== 'number') return;
    if (e.target.closest('.ev.me')) return;
    if (e.target.closest('.x') || inGutter(e)) return;
    const c = cellAt(e);
    if (e.pointerType === 'touch') {
      if (S.drag && S.drag.tap) { S.drag.b = c; commit(S.drag); }
      else { S.drag = {a: c, b: c, tap: true}; ghost(); toast('Now tap the end time'); }
    } else if (S.drag) { S.drag.b = c; commit(S.drag); }
  };
  body.onpointercancel = e => {
    S.editCandidate = null;
    if (e.pointerType === 'touch') {
      S.touchPoints.delete(e.pointerId);
      if (!S.touchPoints.size) { S.pinching = false; S.pinchStart = null; }
      return;
    }
    S.drag = null; ghost();
  };
  body.onclick = e => {
    const x = e.target.closest('.x');
    if (x) { save(mine().filter(b => b.s !== +x.dataset.s)); return; }
  };
  body.onkeydown = e => {
    if (e.target.closest('.x')) return;
    const block = e.target.closest('.ev.me');
    if (block && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); editBlock(+block.dataset.s, +block.dataset.e); }
  };
  document.onkeydown = e => { if (e.key === 'Escape') { S.drag = null; ghost(); } };
}


async function askName() {
  return new Promise(res => {
    const m = document.createElement('div');
    m.className = 'modal';
    m.innerHTML = `
      <div class="card">
        <h2>What's your name?</h2>
        <p class="muted">Others in this group see it next to your free times.</p>
        <input id="nm" maxlength="24" style="width:100%" placeholder="Enter your name">
        <p><button class="btn primary" id="ok">Continue</button></p>
      </div>
    `;
    document.body.append(m);
    const input = m.querySelector('#nm');
    const button = m.querySelector('#ok');
    const go = () => {
      const v = input.value.trim();
      if (!v) {
        input.focus();
        return;
      }
      S.name = v;
      localStorage.setItem('hf-name:' + gid, v);
      m.remove();
      res();
    };
    button.addEventListener('click', go);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') go();
    });
    input.focus();
  });
}

async function sync() {
  if (S.pending || S.drag || document.hidden) return;
  try {
    const g = await api.get(gid), p = norm(g);
    if (JSON.stringify(p) !== JSON.stringify(S.people) || (g.title || '') !== S.title) { S.people = p; S.title = g.title || ''; render(); }
  } catch {}
}

async function group() {
  document.body.innerHTML = `<header><b class="logo">Hangout Finder</b><span id="ttl" class="muted"></span><span style="flex:1"></span>
    <button class="btn" id="today">Today</button><button class="ib" id="prev">‹</button><button class="ib" id="next">›</button><b id="range" style="min-width:150px"></b>
    <select id="view"><option value="1">Day</option><option value="3">3 days</option><option value="7">Week</option><option value="14">2 weeks</option><option value="month">Month</option><option value="year">Year</option></select>
    <button class="btn" id="copy">Copy invite link</button><button class="btn" id="who"></button></header>
    <main><div id="scroll" aria-label="Calendar: hold Control or Command while scrolling to zoom, or use a two-finger pinch"><div class="row" id="head"></div><div id="body"></div></div><aside id="side"></aside></main><div id="toast"></div>`;
  S.name = localStorage.getItem('hf-name:' + gid) || '';
  const step = d => {
    S.drag = null;
    if (S.view === 'year') { const date = new Date(S.anchor); date.setFullYear(date.getFullYear() + d); S.anchor = date.getTime(); }
    else if (S.view === 'month') { const date = new Date(S.anchor); date.setMonth(date.getMonth() + d); S.anchor = monthStart(date.getTime()); }
    else S.anchor = addDays(S.anchor, d * S.view);
    render();
  };
  $('#prev').onclick = () => step(-1); $('#next').onclick = () => step(1);
  $('#today').onclick = () => { S.anchor = startOfDay(Date.now()); render(); };
  $('#view').onchange = e => {
    const value = e.target.value;
    S.view = value === 'month' || value === 'year' ? value : +value;
    if (S.view === 'month') S.anchor = monthStart(S.anchor);
    if (S.view === 'year') { const d = new Date(S.anchor); d.setMonth(0, 1); S.anchor = startOfDay(d.getTime()); }
    S.drag = null; render();
  };
  let horizontalWheel = 0, horizontalWheelTimer;
  $('#scroll').addEventListener('wheel', e => {
    if ((e.ctrlKey || e.metaKey) && typeof S.view === 'number') {
      e.preventDefault();
      zoomAt(S.hr * Math.exp(-e.deltaY * .002), e.clientY);
      return;
    }
    const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.shiftKey ? e.deltaY : 0;
    if (!delta) return;
    e.preventDefault();
    horizontalWheel += delta;
    clearTimeout(horizontalWheelTimer);
    horizontalWheelTimer = setTimeout(() => {
      if (Math.abs(horizontalWheel) >= 15) step(horizontalWheel > 0 ? 1 : -1);
      horizontalWheel = 0;
    }, 140);
  }, {passive: false});
  $('#copy').onclick = () => navigator.clipboard.writeText(location.href).then(() => toast('Invite link copied'), () => prompt('Copy this link:', location.href));
  $('#who').onclick = async () => {
    const old = S.name, ob = mine(); await askName();
    if (old && key(old) !== key(S.name)) { delete S.people[key(old)]; try { await api.put(gid, 'people/' + key(old), null); } catch {} }
    save(ob);
  };
  try { const g = await api.get(gid); S.people = norm(g); S.title = g.title || ''; } catch { toast("Couldn't load this group."); }
  remember(gid, S.title); render(); $('#scroll').scrollTop = S.hr * 7;
  if (!S.name) await askName();
  if (!S.people[key(S.name)]) save([]);
  setInterval(sync, 4000); setInterval(() => !S.drag && render(), 60000);
  document.addEventListener('visibilitychange', sync);
}

gid ? group() : landing();
</script>
</body>
</html>
