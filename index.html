<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hangout Finder</title>
<style>
:root{--bg:#f8fafd;--surface:#fff;--fg:#202124;--muted:#5f6368;--line:#e1e5eb;--accent:#0b57d0;--onaccent:#fff;--panel:#edf2fa;--hr:48px;
  --evs:75%;--evl:86%;--evfg:22%;--evbar:45%;--best:rgba(52,168,83,.16)}
@media(prefers-color-scheme:dark){:root{--bg:#202124;--surface:#202124;--fg:#e8eaed;--muted:#9aa0a6;--line:#3c4043;--accent:#a8c7fa;--onaccent:#062e6f;--panel:#303134;
  --evs:35%;--evl:28%;--evfg:90%;--evbar:60%;--best:rgba(52,168,83,.25)}}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;font:14px/1.45 "Google Sans",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--fg)}
button,select,input{font:inherit;color:inherit}
input,select{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--bg)}
#view{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.muted,small{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 18px;cursor:pointer;transition:background .15s,box-shadow .15s}
.btn:hover,.ib:hover{background:var(--panel)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:none;cursor:pointer;font-size:22px;line-height:1;display:inline-grid;place-items:center;flex:0 0 auto}
header{position:relative;z-index:20;display:flex;align-items:center;gap:10px;min-height:72px;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:nowrap}
.logo{display:flex;align-items:center;gap:11px;font-size:21px;font-weight:500;white-space:nowrap;margin-right:8px}
.logo-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--onaccent);font-size:19px;font-weight:650}
.toolbar-spacer{flex:1;min-width:8px}
#ttl{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#range{min-width:155px;font-size:19px;font-weight:450;white-space:nowrap}
main{position:relative;flex:1;display:flex;min-height:0}
main.sidebar-collapsed aside{display:none}
#scroll{order:2;flex:1;overflow-y:auto;min-width:0;margin:10px 14px 14px 0;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.row,#body{display:grid;grid-template-columns:56px repeat(var(--n),1fr)}
#head{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);border-radius:14px 14px 0 0;user-select:none;-webkit-user-select:none}
.dh{text-align:center;padding:6px 0;border-left:1px solid var(--line)}
.dh small{display:block;font-size:11px;letter-spacing:.6px}
.dh b{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;font-size:22px;font-weight:400}
.dh.today b{background:var(--accent);color:var(--onaccent)}
#body{user-select:none;-webkit-user-select:none;touch-action:pan-y;cursor:crosshair}
.gut{position:relative}
.gut span{position:absolute;right:8px;transform:translateY(-50%);font-size:10px;color:var(--muted)}
.col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(color-mix(in srgb,var(--line) 72%,transparent) 1px,transparent 1px);background-size:100% var(--hr)}
.ev{position:absolute;border-radius:8px;padding:3px 6px;overflow:hidden;font-size:12px;line-height:1.25;pointer-events:none;z-index:1;
  background:color-mix(in srgb,var(--c) 24%,var(--bg));color:var(--fg);border-left:4px solid var(--c);box-shadow:0 0 0 1px var(--bg)}
.ev b{display:block}
.ev.me{box-shadow:0 0 0 1px var(--bg),0 1px 4px rgba(0,0,0,.35);pointer-events:auto;cursor:grab;touch-action:none}
.ev.me:active{cursor:grabbing}
.ev.me.selected{outline:2px solid var(--accent);outline-offset:1px}
.ev.me::before,.ev.me::after{content:"";position:absolute;left:0;right:0;height:7px;border-radius:999px;cursor:ns-resize;z-index:2;opacity:0}
.ev.me::before{top:0}
.ev.me::after{bottom:0}
.ev.me.resize-start::before,.ev.me.resize-end::after{background:var(--c);opacity:.65}
@media(hover:none){.ev.me.resize-start::before,.ev.me.resize-end::after{opacity:.55}}
.ev.ghost{opacity:.8;outline:2px dashed var(--c);z-index:2}
.x{position:absolute;top:2px;right:2px;width:18px;height:18px;border:0;border-radius:50%;background:rgba(0,0,0,.15);cursor:pointer;pointer-events:auto;display:none;line-height:1;font-size:13px;padding:0}
.ev.me:hover .x{display:block}
@media(hover:none){.ev.me .x{display:block}}
.best{position:absolute;left:0;right:0;border-radius:8px;background:var(--best);outline:2px dashed #34a853;outline-offset:-2px;pointer-events:none}
.now{position:absolute;left:0;right:0;height:2px;background:#ea4335;pointer-events:none;z-index:3}
.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#ea4335}
aside{order:1;flex:0 0 288px;width:288px;border-right:1px solid var(--line);padding:18px 14px;overflow:auto;background:var(--bg)}
aside h3{margin:20px 8px 9px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:650}
aside h3:first-child{margin-top:0}
.item{padding:10px 12px;margin:0 4px 6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.item:hover{border-color:var(--accent);background:var(--panel)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.person-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:color-mix(in srgb,var(--person-color) 70%,var(--fg))}
.person-name small{color:inherit;opacity:.8}
.person-name-picker{position:relative;display:inline-flex;align-items:center;cursor:pointer}
.name-color-picker{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;opacity:0;cursor:pointer;appearance:none;-webkit-appearance:none}
.slot-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 4px 8px}
.slot-form input[type=date],.slot-form button,.time-toggle,.slot-time-fields{grid-column:1/-1}
.slot-form input{width:100%;min-width:0;padding:8px 10px}
.time-toggle{display:flex;align-items:center;gap:9px;padding:2px 4px;cursor:pointer}
.time-toggle input{width:16px;height:16px;margin:0;accent-color:var(--accent)}
.slot-time-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot-time-fields[hidden]{display:none}
.filter-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.filter-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:4px 7px;background:var(--panel);font-size:11px}
.filter-chip button{border:0;background:none;cursor:pointer;padding:0 1px;font-size:15px;line-height:1}
.filter-person{padding:8px 10px;margin:5px 4px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.filter-person-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.person-ident{display:flex;align-items:center;gap:5px;min-width:0;flex:1}
.filter-count{font-size:11px;color:var(--muted)}
.filter-statuses{display:flex;align-items:center;gap:3px;flex:0 1 auto;max-width:96px;overflow-x:auto}
.filter-status{display:grid;place-items:center;flex:0 0 16px;width:16px;height:16px;border-radius:50%;background:var(--person-color);color:#fff;font-size:10px;font-weight:700;line-height:1}
.filter-status.no{border:1px solid var(--person-color);background:transparent;color:var(--person-color)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20}
.card{background:var(--bg);border-radius:16px;padding:24px;width:min(380px,90vw);box-shadow:0 8px 30px rgba(0,0,0,.3)}
.card h2{margin:0 0 4px}
.edit-field{display:block;margin:12px 0}
.edit-field input{display:block;width:100%;margin-top:4px}
.modal-actions,.modal-buttons{display:flex;align-items:center;gap:8px}
.modal-actions{justify-content:space-between;margin-top:18px}
.modal-buttons{justify-content:flex-end}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
.mini-cal{padding:4px 7px 14px;border-bottom:1px solid var(--line);margin-bottom:16px}
.mini-cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mini-cal-head b{font-size:13px;font-weight:600}
.mini-cal-head .ib{width:30px;height:30px;font-size:19px}
.mini-cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.mini-cal-weekday,.mini-cal-day{display:grid;place-items:center;min-width:0;height:30px;font-size:11px}
.mini-cal-weekday{color:var(--muted);font-weight:600}
.mini-cal-day{position:relative;border:0;border-radius:50%;background:transparent;cursor:pointer}
.mini-cal-day:hover{background:var(--panel)}
.mini-cal-day.other{color:var(--muted);opacity:.5}
.mini-cal-day.today{color:var(--accent);font-weight:700}
.mini-cal-day.selected{background:var(--accent);color:var(--onaccent)}
.mini-cal-day.has::after{content:"";position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.mini-cal-day.selected.has::after{background:var(--onaccent)}
.land{max-width:420px;margin:10vh auto;padding:0 20px;display:flex;flex-direction:column;gap:12px}
.land a{color:var(--accent);text-decoration:none;padding:6px 0}
.calendar-view{padding:18px;max-width:1100px;margin:0 auto}
.month-grid{display:grid;grid-template-columns:repeat(7,minmax(34px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);user-select:none;-webkit-user-select:none}
.weekday,.month-day{border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
.weekday{padding:8px 2px;color:var(--muted);font-size:12px;font-weight:600}
.month-day{min-height:84px;padding:8px 4px;cursor:pointer;touch-action:none}
.month-day:hover,.year-month:hover{background:var(--panel)}
.month-day.range-selected{background:color-mix(in srgb,var(--accent) 18%,var(--surface))}
.month-day.other{color:var(--muted);opacity:.55}
.month-day.today .day-number{background:var(--accent);color:var(--onaccent)}
.day-number{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%}
.availability-dots{display:flex;justify-content:center;flex-wrap:wrap;gap:3px;margin:7px auto 0;max-width:56px}
.availability-dots i{width:7px;height:7px;border-radius:50%}
.year-grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px;user-select:none;-webkit-user-select:none}
.year-month{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.year-month h3{margin:0 0 8px;font-size:14px}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:10px}
.mini-grid span{min-height:18px;display:grid;place-items:center;border-radius:4px}
.mini-grid .mini-day{touch-action:none}
.mini-grid .mini-weekday{color:var(--muted);font-weight:600}
.mini-grid .mini-day.other{opacity:.3}
.mini-grid .mini-day.has{background:color-mix(in srgb,var(--day-color) 28%,var(--bg))}
.mini-grid .mini-day.overlap{outline:1px solid #34a853}
.mini-grid .mini-day.range-selected{outline:2px solid var(--accent);background:var(--panel)}
@media(max-width:700px){.year-grid{grid-template-columns:repeat(2,minmax(120px,1fr))}.month-day{min-height:60px;padding:4px 1px}.availability-dots{gap:2px}}
@media(max-width:900px){header{padding:9px 14px;gap:6px}.logo{font-size:18px;margin-right:2px}#ttl{display:none}#range{min-width:120px;font-size:17px}aside{flex-basis:260px;width:260px}}
@media(max-width:700px){header{min-height:62px;flex-wrap:wrap;padding:7px 10px;gap:4px}.logo{font-size:17px}.logo-mark{width:30px;height:30px}#range{min-width:auto;font-size:15px}#view{max-width:112px;padding:8px 26px 8px 10px;background-position:calc(100% - 13px) 50%,calc(100% - 8px) 50%}header .btn{padding:7px 11px}.toolbar-spacer{display:none}main{overflow:hidden}aside{position:absolute;inset:0 auto 0 0;z-index:15;width:min(320px,88vw);max-height:none;box-shadow:0 10px 24px rgba(0,0,0,.18);transform:translateX(-105%);transition:transform .2s ease}main.sidebar-open aside{transform:translateX(0)}#scroll{margin:7px;border-radius:12px}.row,#body{grid-template-columns:48px repeat(var(--n),minmax(58px,1fr))}}
</style>
</head>
<body>
<script>


  
//THIS IS WHAT YOU ARE REPLACING WITH THE FIREBASE LINK YOU JUST COPIED

const DB = "https://overlapcal-default-rtdb.firebaseio.com/";


  
const HR = 48, GUT = 56, HOUR = 36e5, $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS = ['#4285f4','#ea4335','#34a853','#fbbc04','#a142f4','#ff6d01','#12a4a6','#e52592','#5f6368','#7cb342','#8e24aa','#00897b'];
const validColor = c => /^#[0-9a-f]{6}$/i.test(c || '');
const colorHex = h => {
  const f = n => { const k = (n + h / 30) % 12, a = .325; return .5 - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return '#' + [f(0), f(8), f(4)].map(c => Math.round(c * 255).toString(16).padStart(2, '0')).join('');
};
const nextColor = used => {
  const palette = COLORS.find(c => !used.has(c));
  if (palette) return palette;
  for (let h = 0; h < 360; h++) { const color = colorHex(h); if (!used.has(color)) return color; }
  for (let n = 1; n <= 0xffffff; n++) { const color = '#' + n.toString(16).padStart(6, '0'); if (!used.has(color)) return color; }
  throw Error('No unused participant colors remain.');
};
const colorOf = p => validColor(p.color) ? p.color : '#4285f4';
const key = n => n.trim().toLowerCase().replace(/[.$#\[\]\/]/g, '_');
const fmtT = t => new Date(t).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
const fmtD = t => new Date(t).toLocaleDateString([], {weekday: 'short', month: 'short', day: 'numeric'});
const addDays = (t, n) => { const d = new Date(t); d.setDate(d.getDate() + n); return d.getTime(); };
const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const inputDate = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const inputDateTime = t => { const d = new Date(t); return `${inputDate(t)}T${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const slotTime = (date, time) => { const [y, m, d] = date.split('-').map(Number), [h, min] = time.split(':').map(Number); return new Date(y, m - 1, d, h, min).getTime(); };
const merge = bs => { const o = []; for (const b of [...bs].sort((a, c) => a.s - c.s)) { const l = o[o.length - 1]; l && b.s <= l.e ? l.e = Math.max(l.e, b.e) : o.push({s: b.s, e: b.e}); } return o; };
const toast = m => { const t = $('#toast'); t.textContent = m; t.className = 'on'; clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 2200); };

// ---- storage: Firebase Realtime Database over plain fetch, or localStorage in demo mode ----
const api = {
  async get(id) {
    if (!DB) return JSON.parse(localStorage.getItem('hf:' + id) || '{}');
    const r = await fetch(`${DB}/groups/${id}.json`); if (!r.ok) throw Error(r.status);
    return (await r.json()) || {};
  },
  async put(id, path, val) {
    if (!DB) {
      const g = JSON.parse(localStorage.getItem('hf:' + id) || '{}'), [a, b] = path.split('/');
      if (b) { g[a] = g[a] || {}; val == null ? delete g[a][b] : g[a][b] = val; } else val == null ? delete g[a] : g[a] = val;
      return localStorage.setItem('hf:' + id, JSON.stringify(g));
    }
    const p = path.split('/').map(encodeURIComponent).join('/');
    const r = await fetch(`${DB}/groups/${id}/${p}.json`, {method: val == null ? 'DELETE' : 'PUT', body: JSON.stringify(val)});
    if (!r.ok) throw Error(r.status);
  }
};

const gid = (location.hash.match(/^#\/g\/([\w-]{10,30})$/) || [])[1];
addEventListener('hashchange', () => location.reload());

// ---- landing page: create a new group ----
function landing() {
  const groups = JSON.parse(localStorage.getItem('hf-groups') || '[]');
  document.body.innerHTML = `<div class="land"><h1 style="margin:0">Hangout Finder</h1>
    <p class="muted">Make a group, send the link, and everyone adds when they're free. The best overlap shows up automatically.</p>
    <input id="t" placeholder="Group name (e.g. Friday dinner)" maxlength="60">
    <button class="btn primary" id="go">Create group link</button>
    ${groups.length ? '<h3>Your groups</h3>' + groups.map(g => `<a href="#/g/${g.id}">${esc(g.title || 'Untitled group')}</a>`).join('') : ''}
    ${DB ? '' : '<p class="muted"><small>Demo mode: data stays in this browser. Set DB in index.html to sync between people.</small></p>'}</div><div id="toast"></div>`;
  $('#go').onclick = async () => {
    const id = [...crypto.getRandomValues(new Uint8Array(16))].map(b => (b % 36).toString(36)).join(''), title = $('#t').value.trim();
    try { await api.put(id, 'title', title || null); } catch { return toast('Could not create group. Check your connection.'); }
    remember(id, title); location.hash = '#/g/' + id;
  };
}
function remember(id, title) {
  const l = JSON.parse(localStorage.getItem('hf-groups') || '[]').filter(g => g.id !== id);
  localStorage.setItem('hf-groups', JSON.stringify([{id, title}, ...l].slice(0, 30)));
}

// ---- group page ----
const S = {people: {}, title: '', name: '', view: innerWidth < 700 ? 3 : 7, anchor: startOfDay(Date.now()), drag: null, dateDrag: null, suppressDateClick: false, specificAvailabilityTime: false, availabilityStart: '18:00', availabilityEnd: '19:00', editCandidate: null, selectedBlock: null, resize: null, move: null, pending: 0, hr: HR, pinching: false, pinchStart: null, touchPoints: new Map(), filters: []};
const mine = () => (S.people[key(S.name)] || {}).blocks || [];
const days = () => { const count = +S.view, s = count >= 7 ? addDays(S.anchor, -new Date(S.anchor).getDay()) : S.anchor; return Array.from({length: count}, (_, i) => addDays(s, i)); };
const monthStart = t => { const d = new Date(t); d.setDate(1); d.setHours(0, 0, 0, 0); return d.getTime(); };
const norm = g => {
  const people = {}, used = new Set();
  for (const [k, v] of Object.entries(g.people || {})) {
    let color = validColor(v.color) && !used.has(v.color.toLowerCase()) ? v.color.toLowerCase() : null;
    if (!color) color = nextColor(used);
    used.add(color);
    people[k] = {name: v.name || k, color, blocks: merge(Object.values(v.blocks || {}).filter(b => b && b.e > b.s))};
  }
  return people;
};

function bestAll() {
  const P = Object.values(S.people).filter(p => p.blocks.length);
  const total = Object.keys(S.people).length;
  const pts = [...new Set(P.flatMap(p => p.blocks.flatMap(b => [b.s, b.e])))].sort((a, b) => a - b), segs = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], z = pts[i + 1], who = P.filter(p => p.blocks.some(x => x.s <= a && x.e >= z)).map(p => p.name).sort();
    if (who.length) segs.push({s: a, e: z, who});
  }
  const max = Math.max(0, ...segs.map(s => s.who.length)), list = [];
  const join = matches => {
    const out = [];
    for (const s of matches) {
      const last = out[out.length - 1];
      last && last.e === s.s && last.who.join() === s.who.join() ? last.e = s.e : out.push({...s});
    }
    return out;
  };
  if (max >= 2) {
    for (const s of join(segs.filter(s => s.who.length === max))) list.push(s);
  }
  return {max, list, everyone: total ? join(segs.filter(s => s.who.length === total)) : []};
}

const availableOn = (person, start, end) => person.blocks.some(b => b.s < end && b.e > start);
function calendarDots(start, end) {
  const people = Object.values(S.people).filter(p => availableOn(p, start, end));
  return `<span class="availability-dots">${people.map(p => `<i title="${esc(p.name)}" style="background:${colorOf(p)}"></i>`).join('')}</span>`;
}
function layoutEvents(events) {
  events.sort((a, b) => a.s - b.s || a.e - b.e || a.k.localeCompare(b.k));
  const laneEnds = [], lanes = [];
  events.forEach(event => {
    let lane = laneEnds.findIndex(end => end <= event.s);
    if (lane < 0) { lane = laneEnds.length; laneEnds.push(event.e); lanes.push([]); }
    else laneEnds[lane] = event.e;
    event.lane = lane;
    lanes[lane].push(event);
  });
  const columns = Math.max(laneEnds.length, 1);
  events.forEach(event => {
    event.span = 1;

      if (Math.hypot(e.clientX - move.startX, e.clientY - move.startY) < 4) return;
      move.active = true; S.editCandidate = null; body.setPointerCapture(e.pointerId);
    }
    const c = cellAt(e), time = days()[c.d] + c.m * 60000, delta = time - move.pointerTime;
    move.preview = {s: move.original.s + delta, e: move.original.e + delta};
    ghost();
  };
  const selectBlock = start => {
    S.selectedBlock = start;
    document.querySelectorAll('.ev.me.selected').forEach(el => el.classList.remove('selected'));
    const selected = [...document.querySelectorAll('.ev.me')].find(el => +el.dataset.s === start);
    selected?.classList.add('selected');
  };
  body.onpointerdown = e => {
    if (e.target.closest('.x') || typeof S.view !== 'number' || inGutter(e)) return;
    if (e.pointerType === 'touch') {
      S.touchPoints.set(e.pointerId, {x: e.clientX, y: e.clientY});
      if (S.touchPoints.size === 2 && typeof S.view === 'number') {
        const points = [...S.touchPoints.values()];
        S.touchPoints.forEach((point, id) => body.setPointerCapture(id));
        S.editCandidate = null; S.move = null; S.pinching = true; S.drag = null; ghost();
        S.pinchStart = {distance: Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y), hr: S.hr, y: (points[0].y + points[1].y) / 2};
      } else {
        const block = e.target.closest('.ev.me');
        if (block) {
          const start = +block.dataset.s, c = cellAt(e);
          S.move = {start, original: {s: start, e: +block.dataset.e}, startX: e.clientX, startY: e.clientY,
            pointerTime: days()[c.d] + c.m * 60000, active: false, preview: {s: start, e: +block.dataset.e}};
          S.editCandidate = start;
          const edge = resizeEdgeAt(block, e);
          if (edge) {
            const original = S.move.original;
            S.resize = {start: original.s, edge, original, preview: original};
            S.move = null; S.editCandidate = null; block.classList.add('resize-' + edge); e.preventDefault(); body.setPointerCapture(e.pointerId); ghost();
          }
        } else S.editCandidate = null;
      }
      return;
    }
    const block = e.target.closest('.ev.me');
    if (block) {
      const start = +block.dataset.s, c = cellAt(e);
      S.move = {start, original: {s: start, e: +block.dataset.e}, startX: e.clientX, startY: e.clientY,
        pointerTime: days()[c.d] + c.m * 60000, active: false, preview: {s: start, e: +block.dataset.e}};
      S.editCandidate = start;
      const edge = resizeEdgeAt(block, e);
      if (edge) {
        const original = S.move.original;
        S.resize = {start: original.s, edge, original, preview: original};
        S.move = null; S.editCandidate = null; block.classList.add('resize-' + edge); e.preventDefault(); body.setPointerCapture(e.pointerId); ghost();
      }
      return;
    }
    S.editCandidate = null; S.move = null;
    S.drag = {a: cellAt(e), b: cellAt(e), moved: false}; body.setPointerCapture(e.pointerId); ghost();
  };
  body.onpointermove = e => {
    if (e.pointerType === 'touch') {
      if (!S.touchPoints.has(e.pointerId)) return;
      S.touchPoints.set(e.pointerId, {x: e.clientX, y: e.clientY});
      if (S.resize) { resizeTo(e); return; }
      if (S.move && S.touchPoints.size === 1) { moveTo(e); return; }
      updateResizeHandle(e);
      if (S.pinching && S.touchPoints.size === 2 && S.pinchStart) {
        const points = [...S.touchPoints.values()];
        const distance = Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
        zoomAt(S.pinchStart.hr * distance / S.pinchStart.distance, S.pinchStart.y);
      }
      return;
    }
    if (S.resize) { resizeTo(e); return; }
    if (S.move) { moveTo(e); return; }
    if (!S.drag) updateResizeHandle(e);
    if (!S.drag || S.drag.tap) return;
    const b = cellAt(e); S.drag.moved = S.drag.moved || b.d !== S.drag.a.d || b.m !== S.drag.a.m; S.drag.b = b; ghost();
  };
  body.onpointerup = e => {
    if (e.pointerType === 'touch') {
      const wasPinching = S.pinching;
      S.touchPoints.delete(e.pointerId);
      if (wasPinching) {
        if (!S.touchPoints.size) { S.pinching = false; S.pinchStart = null; S.drag = null; ghost(); }
        return;
      }
    }
    if (S.resize) {
      const resize = S.resize; S.resize = null; ghost();
      document.querySelectorAll('.ev.me.resize-start,.ev.me.resize-end').forEach(el => el.classList.remove('resize-start', 'resize-end'));
      const {s, e: end} = resize.preview;
      if (s !== resize.original.s || end !== resize.original.e) {
        S.selectedBlock = s;
        save(merge([...mine().filter(b => b.s !== resize.start), {s, e: end}]));
      } else {
        S.selectedBlock = resize.start;
        document.querySelectorAll('.ev.me.selected').forEach(el => el.classList.remove('selected'));
        const selected = [...document.querySelectorAll('.ev.me')].find(el => +el.dataset.s === resize.start);
        selected?.classList.add('selected');
      }
      return;
    }
    if (S.move) {
      const move = S.move; S.move = null; S.editCandidate = null; ghost();
      if (move.active && (move.preview.s !== move.original.s || move.preview.e !== move.original.e)) {
        S.selectedBlock = move.preview.s;
        save(merge([...mine().filter(b => b.s !== move.start), move.preview]));
      } else selectBlock(move.start);
      return;
    }
    if (S.editCandidate !== null) {
      const start = S.editCandidate; S.editCandidate = null; selectBlock(start); return;
    }
    if (typeof S.view !== 'number') return;
    if (e.target.closest('.ev.me')) return;
    if (e.target.closest('.x') || inGutter(e)) return;
    const c = cellAt(e);
    if (e.pointerType === 'touch') {
      if (S.drag && S.drag.tap) { S.drag.b = c; commit(S.drag); }
      else { S.drag = {a: c, b: c, tap: true}; ghost(); toast('Now tap the end time'); }
    } else if (S.drag) { S.drag.b = c; commit(S.drag); }
  };
  body.onpointercancel = e => {
    S.editCandidate = null; S.resize = null; S.move = null; ghost();
    document.querySelectorAll('.ev.me.resize-start,.ev.me.resize-end').forEach(el => el.classList.remove('resize-start', 'resize-end'));
    if (e.pointerType === 'touch') {
      S.touchPoints.delete(e.pointerId);
      if (!S.touchPoints.size) { S.pinching = false; S.pinchStart = null; }
      return;
    }
    S.drag = null; ghost();
  };
  body.onclick = e => {
    const x = e.target.closest('.x');
    if (x) { save(mine().filter(b => b.s !== +x.dataset.s)); return; }
  };
  body.ondblclick = e => {
    if (e.target.closest('.x')) return;
    const block = e.target.closest('.ev.me');
    if (block) editBlock(+block.dataset.s, +block.dataset.e);
  };
  body.onkeydown = e => {
    if (e.target.closest('.x')) return;
    const block = e.target.closest('.ev.me');
    if (block && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); editBlock(+block.dataset.s, +block.dataset.e); }
  };
  document.onkeydown = e => {
    if (e.key === 'Escape') { S.drag = null; S.move = null; ghost(); }
    if ((e.key === 'Delete' || e.key === 'Backspace') && !e.target.closest('input,textarea,select,.modal') && S.selectedBlock !== null && document.querySelector('.ev.me.selected')) {
      const start = S.selectedBlock, block = mine().find(b => b.s === start);
      if (block) {
        e.preventDefault(); S.selectedBlock = null;
        save(mine().filter(b => b.s !== start)); toast('Availability removed.');
      }
    }
  };
}


async function askName() {
  return new Promise(res => {
    const m = document.createElement('div');
    m.className = 'modal';
    m.innerHTML = `
      <div class="card">
        <h2>What's your name?</h2>
        <p class="muted">Others in this group see it next to your free times.</p>
        <input id="nm" maxlength="24" style="width:100%" placeholder="Enter your name">
        <p><button class="btn primary" id="ok">Continue</button></p>
      </div>
    `;
    document.body.append(m);
    const input = m.querySelector('#nm');
    const button = m.querySelector('#ok');
    const go = () => {
      const v = input.value.trim();
      if (!v) {
        input.focus();
        return;
      }
      S.name = v;
      localStorage.setItem('hf-name:' + gid, v);
      m.remove();
      res();
    };
    button.addEventListener('click', go);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') go();
    });
    input.focus();
  });
}

async function sync() {
  if (S.pending || S.drag || S.dateDrag || S.resize || S.move || document.hidden) return;
  try {
    const g = await api.get(gid), p = norm(g);
    if (JSON.stringify(p) !== JSON.stringify(S.people) || (g.title || '') !== S.title) { S.people = p; S.title = g.title || ''; render(); }
  } catch {}
}

async function group() {
  document.body.innerHTML = `<header><button class="ib" id="menu" aria-label="Toggle sidebar" title="Toggle sidebar">☰</button><b class="logo"><span class="logo-mark">H</span>Hangout Finder</b><span id="ttl" class="muted"></span><span class="toolbar-spacer"></span>
    <button class="btn" id="today">Today</button><button class="ib" id="prev" aria-label="Previous date range">‹</button><button class="ib" id="next" aria-label="Next date range">›</button><b id="range"></b>
    <select id="view"><option value="1">Day</option><option value="3">3 days</option><option value="7">Week</option><option value="14">2 weeks</option><option value="month">Month</option><option value="year">Year</option></select>
    <button class="btn" id="copy">Copy invite link</button><button class="btn" id="who"></button></header>
    <main><div id="scroll" aria-label="Calendar: drag in hourly views to add availability; drag date ranges in Month or Year views to mark all-day availability; hold Control or Command while scrolling or use a two-finger pinch to zoom"><div class="row" id="head"></div><div id="body"></div></div><aside id="side"></aside></main><div id="toast"></div>`;
  S.name = localStorage.getItem('hf-name:' + gid) || '';
  const step = d => {
    S.drag = null;
    if (S.view === 'year') { const date = new Date(S.anchor); date.setFullYear(date.getFullYear() + d); S.anchor = date.getTime(); }
    else if (S.view === 'month') { const date = new Date(S.anchor); date.setMonth(date.getMonth() + d); S.anchor = monthStart(date.getTime()); }
    else S.anchor = addDays(S.anchor, d * S.view);
    render();
  };
  $('#prev').onclick = () => step(-1); $('#next').onclick = () => step(1);
  $('#menu').onclick = () => {
    const main = $('main');
    main.classList.toggle(innerWidth <= 700 ? 'sidebar-open' : 'sidebar-collapsed');
  };
  $('#today').onclick = () => { S.anchor = startOfDay(Date.now()); render(); };
  $('#view').onchange = e => {
    const value = e.target.value;
    S.view = value === 'month' || value === 'year' ? value : +value;
    if (S.view === 'month') S.anchor = monthStart(S.anchor);
    if (S.view === 'year') { const d = new Date(S.anchor); d.setMonth(0, 1); S.anchor = startOfDay(d.getTime()); }
    S.drag = null; render();
  };
  let horizontalWheel = 0, horizontalWheelTimer;
  $('#scroll').addEventListener('wheel', e => {
    if ((e.ctrlKey || e.metaKey) && typeof S.view === 'number') {
      e.preventDefault();
      zoomAt(S.hr * Math.exp(-e.deltaY * .002), e.clientY);
      return;
    }
    const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.shiftKey ? e.deltaY : 0;
    if (!delta) return;
    e.preventDefault();
    horizontalWheel += delta;
    clearTimeout(horizontalWheelTimer);
    horizontalWheelTimer = setTimeout(() => {
      if (Math.abs(horizontalWheel) >= 15) step(horizontalWheel > 0 ? 1 : -1);
      horizontalWheel = 0;
    }, 140);
  }, {passive: false});
  $('#copy').onclick = () => navigator.clipboard.writeText(location.href).then(() => toast('Invite link copied'), () => prompt('Copy this link:', location.href));
  $('#who').onclick = async () => {
    const old = S.name, ob = mine(); await askName();
    if (old && key(old) !== key(S.name)) { delete S.people[key(old)]; try { await api.put(gid, 'people/' + key(old), null); } catch {} }
    save(ob);
  };
  try { const g = await api.get(gid); S.people = norm(g); S.title = g.title || ''; } catch { toast("Couldn't load this group."); }
  remember(gid, S.title); render(); $('#scroll').scrollTop = S.hr * 7;
  if (!S.name) await askName();
  if (!S.people[key(S.name)]) save([]);
  setInterval(sync, 4000); setInterval(() => !S.drag && render(), 60000);
  document.addEventListener('visibilitychange', sync);
}

gid ? group() : landing();
</script>
</body>
